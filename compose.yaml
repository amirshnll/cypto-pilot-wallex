services:
  web:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - app_data:/app/data
      - static_data:/app/staticfiles
      - backup_data:/app/backups:ro
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
    security_opt:
      - no-new-privileges:true

  bot:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    command:
      - /bin/sh
      - -c
      - while true; do python manage.py collect_market_data || true; python manage.py run_paper_bot || true; python manage.py generate_alerts_reports || true; sleep "$${PAPER_BOT_INTERVAL_SECONDS:-300}"; done
    security_opt:
      - no-new-privileges:true

  backup-init:
    image: alpine:3.22
    restart: "no"
    volumes:
      - backup_data:/app/backups
    command: ["chown", "-R", "100:101", "/app/backups"]
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      SKIP_STARTUP_TASKS: "1"
    depends_on:
      web:
        condition: service_healthy
      backup-init:
        condition: service_completed_successfully
    volumes:
      - app_data:/app/data:ro
      - backup_data:/app/backups
    command:
      - /bin/sh
      - -c
      - while true; do python manage.py backup_database; sleep 86400; done
    security_opt:
      - no-new-privileges:true

volumes:
  app_data:
  static_data:
  backup_data:
